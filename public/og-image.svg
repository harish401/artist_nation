<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Artist Nation Event Management</title>
  <desc id="desc">Premium event management for corporate events, movie promotions, product launches, and team outings in Bangalore and India</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050505"/>
      <stop offset="0.55" stop-color="#15110a"/>
      <stop offset="1" stop-color="#000000"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e8d5a3"/>
      <stop offset="0.52" stop-color="#c9a962"/>
      <stop offset="1" stop-color="#8b7340"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect x="52" y="52" width="1096" height="526" rx="42" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="2"/>
  <circle cx="1035" cy="112" r="154" fill="#c9a962" opacity="0.12"/>
  <circle cx="126" cy="528" r="190" fill="#c9a962" opacity="0.08"/>
  <text x="92" y="150" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="42" font-weight="700" letter-spacing="1">
    ARTIST <tspan fill="url(#gold)">NATION</tspan>
  </text>
  <text x="92" y="288" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="76" font-weight="800">
    Event Management
  </text>
  <text x="92" y="374" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="76" font-weight="800">
